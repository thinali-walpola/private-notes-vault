<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Vault</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="grid"></div>

<div class="container">

    <div class="logo">
        <div class="circle">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1>MIDNIGHT VAULT</h1>
        <p>AES-256-GCM • CLIENT-SIDE ENCRYPTION</p>
    </div>

    <div class="card">
        <span class="title">CREATE VAULT PASSWORD</span>
        <p>
            Your password encrypts all notes locally.
            It is never transmitted anywhere.
        </p>

        <div class="input-box">
            <input
                type="password"
                placeholder="Choose a strong password"
                id="password"
            >
            <i class="fa-solid fa-eye-slash" id="toggle"></i>
        </div>

        <button id="createBtn" class="createBtn">
            <i class="fa-solid fa-lock"></i>
            CREATE VAULT
        </button>
    </div>

    <div class="footer">
        PBKDF2 • 210,000 ITERATIONS • ZERO SERVER CONTACT
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
